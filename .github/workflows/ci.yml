name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Generate synthetic test fixtures
        run: python -m scripts.synthesize_test_audio

      - name: Run fast test suite (mocked ASR -- excludes tests/live)
        run: pytest -v
